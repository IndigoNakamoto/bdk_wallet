# Standalone package (not a member of the sibling BDK workspace).
[workspace]

[package]
name = "bdk_wallet"
homepage = "https://bitcoindevkit.org"
version = "3.1.0-litecoin.0"
repository = "https://github.com/IndigoNakamoto/bdk_wallet"
documentation = "https://docs.rs/bdk_wallet"
description = "A modern, lightweight, descriptor-based wallet library for Litecoin"
keywords = ["litecoin", "wallet", "descriptor", "psbt"]
readme = "README.md"
license = "MIT OR Apache-2.0"
authors = ["Bitcoin Dev Kit Developers"]
edition = "2024"
rust-version = "1.85.0"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs", "--cfg", "bdk_wallet_unstable"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)', 'cfg(bdk_wallet_unstable)'] }

[dependencies]
# Litecoin BDK crates come from the IndigoNakamoto/bdk fork, pinned by rev for
# reproducible standalone builds. For local development against a sibling
# checkout, add [patch] overrides in .cargo/config.toml (see README).
bdk_chain = { git = "https://github.com/IndigoNakamoto/bdk.git", rev = "312d0d566a264637c9a7ddfb85d7673a8f351a26", version = "0.23.2", features = ["miniscript", "serde"], default-features = false }
bdk_mweb = { git = "https://github.com/IndigoNakamoto/bdk.git", rev = "312d0d566a264637c9a7ddfb85d7673a8f351a26", version = "0.1.0", optional = true, default-features = false, features = ["std", "zkp", "persist", "encrypt", "lip0006"] }
bitcoin = { package = "litecoin", version = "0.32.8-rc.2", features = ["serde", "base64"], default-features = false }
miniscript = { git = "https://github.com/IndigoNakamoto/rust-miniscript", rev = "e3187272617adad69f5b9ece62d25ea28b70fd25", features = ["serde"], default-features = false }
rand_core = { version = "0.6.4" }
serde_json = { version = "1" }
serde = { version = "1", features = ["derive"] }

# Optional dependencies
anyhow = { version = "1", optional = true }
bdk_file_store = { git = "https://github.com/IndigoNakamoto/bdk.git", rev = "312d0d566a264637c9a7ddfb85d7673a8f351a26", version = "0.22.0", optional = true }
bip39 = { version = "2.2.2", optional = true }
tempfile = { version = "3.26.0", optional = true }

[features]
default = ["std"]
std = ["bitcoin/std", "bitcoin/rand-std", "miniscript/std", "bdk_chain/std"]
compiler = ["miniscript/compiler"]
all-keys = ["keys-bip39"]
keys-bip39 = ["bip39"]
rusqlite = ["bdk_chain/rusqlite"]
file_store = ["bdk_file_store"]
test-utils = ["std", "anyhow", "tempfile"]
# MWEB facade: CombinedBalance, MwebStore, prepare_mweb_pegin / build_mweb_send / pegout.
mweb = ["dep:bdk_mweb"]
# Parallel MWEB SQLite store (beside wallet rusqlite).
mweb-sqlite = ["mweb", "bdk_mweb/rusqlite", "rusqlite"]
# Declared so upstream `cfg(feature = "bdk-tx")` gates stay valid. Enabling it is unsupported
# until a litecoin-compatible `bdk_tx` exists (crates.io pulls bitcoin types that don't unify).
bdk-tx = []

[dev-dependencies]
anyhow = "1"
assert_matches = "1.5.0"
bdk_electrum = { git = "https://github.com/IndigoNakamoto/bdk.git", rev = "312d0d566a264637c9a7ddfb85d7673a8f351a26", version = "0.23.2" }
bdk_esplora = { git = "https://github.com/IndigoNakamoto/bdk.git", rev = "312d0d566a264637c9a7ddfb85d7673a8f351a26", version = "0.22.1", features = ["async-https", "blocking-https", "tokio"] }
bdk_testenv = { git = "https://github.com/IndigoNakamoto/bdk.git", rev = "312d0d566a264637c9a7ddfb85d7673a8f351a26", features = ["litecoin-daemon"] }
bdk_wallet = { path = ".", features = ["rusqlite", "file_store", "test-utils", "mweb"] }
clap = { version = "4.5.60", features = ["derive", "env"] }
ctrlc = "3.5.2"
minreq = { version = "2", features = ["json-using-serde"] }
rand = "0.8"
tempfile = "3"
tokio = { version = "1.38.1", features = ["rt", "rt-multi-thread", "macros"] }

# Upstream examples that use bdk_tx-gated APIs (create_psbt, PsbtParams). The
# fork's `bdk-tx` feature is a declared-but-unsupported placeholder, so these
# never build here; the gate keeps `cargo test` from trying.
[[example]]
name = "psbt"
required-features = ["bdk-tx"]

[[example]]
name = "replace_by_fee"
required-features = ["bdk-tx"]

[[example]]
name = "mnemonic_to_descriptors"
path = "examples/mnemonic_to_descriptors.rs"
required-features = ["all-keys"]

[[example]]
name = "miniscriptc"
path = "examples/compiler.rs"
required-features = ["compiler"]

[[example]]
name = "electrum"

[[example]]
name = "esplora_async"

[[example]]
name = "esplora_blocking"

[[example]]
name = "mweb_regtest"
required-features = ["mweb", "file_store", "test-utils"]

[[example]]
name = "mainnet_mweb"
required-features = ["mweb", "file_store", "rusqlite"]

# Until crates.io publishes litecoin 0.32.8-rc.2 (native PSBTv2 MWEB maps).
# Must stay on the same rev the bdk fork pins, so litecoin types unify.
[patch.crates-io]
litecoin = { git = "https://github.com/IndigoNakamoto/rust-litecoin.git", rev = "0b3285337f3cc508a5549d245ce20d3b52418f3a" }
