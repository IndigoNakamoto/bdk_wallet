# Fork-specific CI for the litecoin branch.
#
# The inherited upstream workflows (cont_integration.yml and friends) assume
# the upstream dependency set (published crates, MSRV/no_std/WASM matrix) and
# have never run on this branch. Rather than edit them — which would conflict
# on every upstream sync — this workflow builds the fork the way consumers do:
# a standalone checkout whose Cargo.toml pins the IndigoNakamoto/bdk and
# rust-litecoin forks by rev.
#
# Deliberately narrower than upstream's: no MSRV, no_std, or WASM matrix. Those
# target a crate with no MWEB, no zkp, and no C dependencies, none of which
# describes this branch.
name: Litecoin CI

on:
  push:
    branches:
      - litecoin
  pull_request:
    branches:
      - litecoin

permissions:
  contents: read

jobs:
  rust:
    name: Rust fmt, clippy, tests
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Read rather than restated, so the workflow cannot drift from the
      # toolchain the crate actually pins.
      - name: Resolve pinned toolchain
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          test -n "$channel" || { echo "no channel in rust-toolchain.toml"; exit 1; }
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch snapshot
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      # grin_secp256k1zkp and aws-lc-sys build C/C++ through cmake.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang

      - name: Formatting
        run: cargo fmt --all --check

      # Not --all-features: the `bdk-tx` feature is a declared-but-unsupported
      # placeholder that intentionally fails to compile (see Cargo.toml).
      - name: Clippy
        run: cargo clippy --features compiler,all-keys,rusqlite,file_store,test-utils,mweb,mweb-sqlite --all-targets -- -D warnings

      # Node-backed MWEB tests skip themselves when no litecoind is reachable,
      # so this is the pure-Rust suite. Regtest coverage lives in bdk's own
      # workflow, which does provision a node.
      - name: Tests
        run: cargo test --features compiler,all-keys,rusqlite,file_store,test-utils,mweb,mweb-sqlite
